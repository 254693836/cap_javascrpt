specVersion: "3.0"
metadata:
  name: demo.productcatalog
type: application
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /catalog
      configuration:
        baseUri: http://localhost:4004/catalog
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.fe.templates
    - name: sap.m
    - name: sap.ui.core
